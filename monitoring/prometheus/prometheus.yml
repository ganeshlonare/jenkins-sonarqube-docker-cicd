global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
    queue_config:
      max_samples_per_send: 10000
      batch_send_deadline: 5s
      capacity: 100000

    write_relabel_configs:
      - source_labels: [__name__]
        regex: "(http_.*:rate5m|http_.*:rate1h|http_latency:.*|container_.*:avg5m|node_.*|up)"
        action: keep

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "spring-boot-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "172.17.0.1:8081"
        labels:
          service: "spring-boot-app"
          tier: "tier-0"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "172.17.0.1:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "172.17.0.1:8085"
